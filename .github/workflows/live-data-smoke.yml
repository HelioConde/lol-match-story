name: Live Riot Data Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-data-smoke.yml"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "backend-config.js"
  workflow_dispatch:

jobs:
  live-data:
    runs-on: ubuntu-latest
    steps:
      - name: Test AlchemyFlames profile timeline and public story
        env:
          BASE: https://bieihhaobdztjyoweewa.supabase.co/functions/v1
        run: |
          node <<'NODE'
          const base = process.env.BASE;
          const lookup = { gameName: 'AlchemyFlames', tagLine: 'BR1', platform: 'br1', region: 'americas', limit: 5, matchLimit: 5 };
          const post = async (url, body) => {
            const r = await fetch(url, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) });
            let data = null; try { data = await r.json(); } catch {}
            return { r, data };
          };
          const profile = await post(base + '/public-lol-profile', lookup);
          if (profile.r.status === 429) {
            console.log('Riot rate limit active; live smoke skipped safely.');
            process.exit(0);
          }
          if (!profile.r.ok) throw new Error('profile HTTP ' + profile.r.status + ': ' + JSON.stringify(profile.data));
          const matches = profile.data?.matches || [];
          if (!matches.length) throw new Error('AlchemyFlames#BR1 returned no matches');
          const first = matches[0];
          if (!first.id) throw new Error('first match has no id');
          console.log('Profile OK:', profile.data.player?.gameName, profile.data.player?.tagLine, 'matches=', matches.length, 'first=', first.id, first.context);

          const story = await post(base + '/public-lol-match-story', { ...lookup, matchId:first.id });
          if (story.r.status === 429) {
            console.log('Timeline rate limit active; profile smoke still passed.');
            process.exit(0);
          }
          if (!story.r.ok) throw new Error('timeline HTTP ' + story.r.status + ': ' + JSON.stringify(story.data));
          if (!Array.isArray(story.data?.events)) throw new Error('timeline response missing events');
          if (first.context === 'ARENA' && !Array.isArray(story.data?.arenaRounds)) throw new Error('Arena timeline missing combat windows');
          if (first.context === 'ARENA' && story.data.arenaRounds.length < 2) throw new Error('Arena combat-window detection returned too little data');
          console.log('Timeline OK:', first.id, 'events=', story.data.events.length, 'arenaWindows=', story.data.arenaRounds?.length || 0, 'cacheHit=', story.data.cacheHit);

          const publish = await post(base + '/public-lol-story', { action:'publish', ...lookup, matchId:first.id, locale:'pt-BR' });
          if (!publish.r.ok) throw new Error('publish HTTP ' + publish.r.status + ': ' + JSON.stringify(publish.data));
          if (!publish.data?.ok) throw new Error('public story was not persisted');
          const saved = await post(base + '/public-lol-story', { action:'get', matchId:first.id });
          if (!saved.r.ok) throw new Error('public story get HTTP ' + saved.r.status + ': ' + JSON.stringify(saved.data));
          if (saved.data?.story?.match_id !== first.id) throw new Error('persisted story mismatch');
          console.log('Public story OK:', first.id, saved.data.story.riot_id);
          NODE
